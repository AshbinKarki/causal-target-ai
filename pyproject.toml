[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "causal-target-ai"
version = "1.0.0"
description = "Reproducible uplift modeling and budget-constrained marketing decision support"
requires-python = ">=3.11,<3.13"
authors = [{name = "Ashbin Karki"}]
license = "MIT"
dependencies = [
  "numpy>=1.26,<2.3", "pandas>=2.2,<3", "polars>=1.30,<2",
  "pyarrow>=19,<24", "duckdb>=1.2,<2", "scipy>=1.13,<1.17",
  "scikit-learn>=1.5,<1.7", "statsmodels>=0.14,<0.15",
  "lightgbm>=4.5,<5", "optuna>=4.3,<5", "shap>=0.47,<0.49",
  "mlflow-skinny>=3.1,<4", "matplotlib>=3.9,<4", "seaborn>=0.13,<0.14",
  "streamlit>=1.45,<2", "plotly>=6,<7", "joblib>=1.4,<2",
  "requests>=2.32,<3", "psutil>=7,<8", "pyyaml>=6,<7"
]

[project.optional-dependencies]
forest = ["econml>=0.16,<0.17"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<8", "ruff>=0.11,<1", "nbformat>=5.10,<6"]

[project.scripts]
causal-target = "causal_target.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/causal_target"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
filterwarnings = ["ignore:.*does not have valid feature names.*:UserWarning"]
